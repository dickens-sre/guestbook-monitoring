kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: guestbook
nodes:
  - role: control-plane
    # On macOS/Windows the MetalLB IPs live inside Docker's VM and can't be
    # reached from the host, so the same services are also mapped to localhost.
    extraPortMappings:
      - containerPort: 30080 # guestbook frontend
        hostPort: 30080
      - containerPort: 30300 # grafana
        hostPort: 30300
      - containerPort: 30090 # prometheus
        hostPort: 30090
